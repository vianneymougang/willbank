# ==========================================
# GitLab CI/CD Pipeline for WillBank
# ==========================================
# This pipeline builds and tests:
# - 3 Spring Boot microservices (Java 21 + Maven)
# - Angular web app (Angular 20)
# - React Native Expo mobile app
# ==========================================

variables:
  # Docker Registry
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

  # Maven settings
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

  # Image naming
  REGISTRY: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# Define stages
stages:
  - prepare
  - build
  - test
  - package
  - deploy

# ==========================================
# PREPARE STAGE
# ==========================================

cache:dependencies:
  stage: prepare
  image: alpine:latest
  script:
    - echo "Cache preparation complete"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
      - clients/webApp/node_modules/
      - clients/mobileApp/node_modules/
  only:
    - main
    - develop
    - merge_requests

# ==========================================
# BUILD STAGE - Spring Boot Services
# ==========================================

.maven_build_template: &maven_build
  image: maven:3.9.9-eclipse-temurin-21
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
    policy: pull
  artifacts:
    paths:
      - services/*/target/*.jar
    expire_in: 1 day

build:config-server:
  <<: *maven_build
  script:
    - cd services/config-server
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  only:
    changes:
      - services/config-server/**/*
      - .gitlab-ci.yml

build:discovery-server:
  <<: *maven_build
  script:
    - cd services/discovery-server
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  only:
    changes:
      - services/discovery-server/**/*
      - .gitlab-ci.yml

build:api-gateway:
  <<: *maven_build
  script:
    - cd services/api-gateway
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  only:
    changes:
      - services/api-gateway/**/*
      - .gitlab-ci.yml

# ==========================================
# BUILD STAGE - Angular Web App
# ==========================================

build:webapp:
  stage: build
  image: node:20
  script:
    - cd clients/webApp
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - clients/webApp/dist/
    expire_in: 1 day
  cache:
    key: ${CI_COMMIT_REF_SLUG}-webapp
    paths:
      - clients/webApp/node_modules/
    policy: pull-push
  only:
    changes:
      - clients/webApp/**/*
      - .gitlab-ci.yml

# ==========================================
# BUILD STAGE - React Native Mobile App
# ==========================================

lint:mobileapp:
  stage: build
  image: node:20
  script:
    - cd clients/mobileApp
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm run lint
  cache:
    key: ${CI_COMMIT_REF_SLUG}-mobileapp
    paths:
      - clients/mobileApp/node_modules/
    policy: pull-push
  only:
    changes:
      - clients/mobileApp/**/*
      - .gitlab-ci.yml

audit:mobileapp:
  stage: build
  image: node:20
  script:
    - cd clients/mobileApp
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm audit --audit-level=moderate || true
  cache:
    key: ${CI_COMMIT_REF_SLUG}-mobileapp
    paths:
      - clients/mobileApp/node_modules/
    policy: pull
  allow_failure: true
  only:
    changes:
      - clients/mobileApp/**/*
      - .gitlab-ci.yml

# ==========================================
# TEST STAGE - Spring Boot Services
# ==========================================

.maven_test_template: &maven_test
  image: maven:3.9.9-eclipse-temurin-21
  stage: test
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
    policy: pull

test:config-server:
  <<: *maven_test
  script:
    - cd services/config-server
    - mvn $MAVEN_CLI_OPTS test
  coverage: "/Total.*?([0-9]{1,3})%/"
  artifacts:
    when: always
    reports:
      junit:
        - services/config-server/target/surefire-reports/TEST-*.xml
    paths:
      - services/config-server/target/site/jacoco/
    expire_in: 1 week
  only:
    changes:
      - services/config-server/**/*
      - .gitlab-ci.yml

test:discovery-server:
  <<: *maven_test
  script:
    - cd services/discovery-server
    - mvn $MAVEN_CLI_OPTS test
  coverage: "/Total.*?([0-9]{1,3})%/"
  artifacts:
    when: always
    reports:
      junit:
        - services/discovery-server/target/surefire-reports/TEST-*.xml
    paths:
      - services/discovery-server/target/site/jacoco/
    expire_in: 1 week
  only:
    changes:
      - services/discovery-server/**/*
      - .gitlab-ci.yml

test:api-gateway:
  <<: *maven_test
  script:
    - cd services/api-gateway
    - mvn $MAVEN_CLI_OPTS test
  coverage: "/Total.*?([0-9]{1,3})%/"
  artifacts:
    when: always
    reports:
      junit:
        - services/api-gateway/target/surefire-reports/TEST-*.xml
    paths:
      - services/api-gateway/target/site/jacoco/
    expire_in: 1 week
  only:
    changes:
      - services/api-gateway/**/*
      - .gitlab-ci.yml

# ==========================================
# TEST STAGE - Angular Web App
# ==========================================

test:webapp:
  stage: test
  image: node:20
  script:
    - cd clients/webApp
    - corepack enable
    - pnpm install --frozen-lockfile
    - apt-get update && apt-get install -y chromium
    - export CHROME_BIN=/usr/bin/chromium
    - pnpm run test:ci -- --browsers=ChromeHeadlessCI
  artifacts:
    when: always
    paths:
      - clients/webApp/coverage/
    expire_in: 1 week
  cache:
    key: ${CI_COMMIT_REF_SLUG}-webapp
    paths:
      - clients/webApp/node_modules/
    policy: pull
  only:
    changes:
      - clients/webApp/**/*
      - .gitlab-ci.yml

# ==========================================
# TEST STAGE - React Native Mobile App
# ==========================================

typecheck:mobileapp:
  stage: test
  image: node:20
  script:
    - cd clients/mobileApp
    - corepack enable
    - pnpm install --frozen-lockfile
    - npx tsc --noEmit
  cache:
    key: ${CI_COMMIT_REF_SLUG}-mobileapp
    paths:
      - clients/mobileApp/node_modules/
    policy: pull
  only:
    changes:
      - clients/mobileApp/**/*
      - .gitlab-ci.yml

# ==========================================
# PACKAGE STAGE - Docker Images
# ==========================================

.docker_build_template: &docker_build
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  after_script:
    - docker logout "$CI_REGISTRY"
  only:
    refs:
      - main
      - develop
      - merge_requests

docker:config-server:
  <<: *docker_build
  script:
    - cd services/config-server
    - docker build -t $REGISTRY/config-server:$IMAGE_TAG -t $REGISTRY/config-server:latest .
    - docker push $REGISTRY/config-server:$IMAGE_TAG
    - docker push $REGISTRY/config-server:latest
  only:
    refs:
      - main
      - develop
    changes:
      - services/config-server/**/*
      - .gitlab-ci.yml
  dependencies:
    - build:config-server

docker:discovery-server:
  <<: *docker_build
  script:
    - cd services/discovery-server
    - docker build -t $REGISTRY/discovery-server:$IMAGE_TAG -t $REGISTRY/discovery-server:latest .
    - docker push $REGISTRY/discovery-server:$IMAGE_TAG
    - docker push $REGISTRY/discovery-server:latest
  only:
    refs:
      - main
      - develop
    changes:
      - services/discovery-server/**/*
      - .gitlab-ci.yml
  dependencies:
    - build:discovery-server

docker:api-gateway:
  <<: *docker_build
  script:
    - cd services/api-gateway
    - docker build -t $REGISTRY/api-gateway:$IMAGE_TAG -t $REGISTRY/api-gateway:latest .
    - docker push $REGISTRY/api-gateway:$IMAGE_TAG
    - docker push $REGISTRY/api-gateway:latest
  only:
    refs:
      - main
      - develop
    changes:
      - services/api-gateway/**/*
      - .gitlab-ci.yml
  dependencies:
    - build:api-gateway

docker:webapp:
  <<: *docker_build
  script:
    - cd clients/webApp
    - docker build -t $REGISTRY/webapp:$IMAGE_TAG -t $REGISTRY/webapp:latest .
    - docker push $REGISTRY/webapp:$IMAGE_TAG
    - docker push $REGISTRY/webapp:latest
  only:
    refs:
      - main
      - develop
    changes:
      - clients/webApp/**/*
      - .gitlab-ci.yml
  dependencies:
    - build:webapp

# ==========================================
# DEPLOY STAGE
# ==========================================

deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to staging environment..."
    - echo "Config Server Image $REGISTRY/config-server:$IMAGE_TAG"
    - echo "Discovery Server Image $REGISTRY/discovery-server:$IMAGE_TAG"
    - echo "API Gateway Image $REGISTRY/api-gateway:$IMAGE_TAG"
    - echo "Web App Image $REGISTRY/webapp:$IMAGE_TAG"
    # Add your deployment commands here
    # Examples:
    # - kubectl set image deployment/config-server config-server=$REGISTRY/config-server:$IMAGE_TAG
    # - docker-compose pull && docker-compose up -d
    # - ssh user@staging-server "docker pull $REGISTRY/config-server:$IMAGE_TAG && docker-compose up -d"
  environment:
    name: staging
    url: https://staging.willbank.example.com
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to production environment..."
    - echo "Config Server Image $REGISTRY/config-server:$IMAGE_TAG"
    - echo "Discovery Server Image $REGISTRY/discovery-server:$IMAGE_TAG"
    - echo "API Gateway Image $REGISTRY/api-gateway:$IMAGE_TAG"
    - echo "Web App Image $REGISTRY/webapp:$IMAGE_TAG"
    # Add your deployment commands here
    # Examples:
    # - kubectl set image deployment/config-server config-server=$REGISTRY/config-server:$IMAGE_TAG
    # - aws ecs update-service --cluster prod --service config-server --force-new-deployment
  environment:
    name: production
    url: https://willbank.example.com
  only:
    - main
  when: manual
