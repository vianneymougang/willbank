<p-table [value]="accounts" [paginator]="true" [rows]="10">
  <ng-template pTemplate="header">
    <tr>
      <th>Type</th>
      <th>Solde</th>
      <th>Statut</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-account>
    <tr>
      <td>{{ account.type }}</td>
      <td>{{ account.solde }}</td>
      <td>{{ account.statut }}</td>
      <td>
        <button pButton icon="pi pi-eye" class="p-button-rounded p-button-info mr-2" (click)="view(account.id)"></button>
        <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-warning mr-2" (click)="edit(account.id)"></button>
        <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger" (click)="delete(account.id)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>

<button pButton label="Ajouter Compte" icon="pi pi-plus" class="mt-3" (click)="add()"></button>
