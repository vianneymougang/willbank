<p-card header="Relevé de Compte">
  <p-table [value]="statementData" [paginator]="true" [rows]="10">
    <!-- Table pour transactions sur période -->
    <ng-template pTemplate="header">
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Montant</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-transaction>
      <tr>
        <td>{{ transaction.date }}</td>
        <td>{{ transaction.type }}</td>
        <td>{{ transaction.montant }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
