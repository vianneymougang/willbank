<p-table [value]="notifications" [paginator]="true" [rows]="10">
  <ng-template pTemplate="header">
    <tr>
      <th>Type</th>
      <th>Destinataire</th>
      <th>Message</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-notification>
    <tr>
      <td>{{ notification.type }}</td>
      <td>{{ notification.destinataire }}</td>
      <td>{{ notification.message }}</td>
    </tr>
  </ng-template>
</p-table>

<button pButton label="Envoyer Test Notification" icon="pi pi-send" class="mt-3" (click)="send()"></button>
