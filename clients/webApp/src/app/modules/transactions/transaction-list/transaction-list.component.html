<p-table [value]="transactions" [paginator]="true" [rows]="10">
  <ng-template pTemplate="header">
    <tr>
      <th>Type</th>
      <th>Montant</th>
      <th>Statut</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-transaction>
    <tr>
      <td>{{ transaction.type }}</td>
      <td>{{ transaction.montant }}</td>
      <td>{{ transaction.statut }}</td>
      <td>
        <button pButton icon="pi pi-eye" class="p-button-rounded p-button-info mr-2" (click)="view(transaction.id)"></button>
        <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-warning mr-2" (click)="edit(transaction.id)"></button>
        <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger" (click)="delete(transaction.id)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>

<button pButton label="Nouvelle Transaction" icon="pi pi-plus" class="mt-3" (click)="add()"></button>
