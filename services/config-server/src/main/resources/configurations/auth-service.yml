# Database Configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/willbank_auth
    username: ${PG_DB_USERNAME:postgres}
    password: ${PG_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:willbank-super-secret-key-for-jwt-token-signing-minimum-512-bits-required-for-hs512-algorithm}
  access-token-validity-seconds: 1800  # 30 minutes (validated by user)
  refresh-token-validity-seconds: 604800  # 7 days (validated by user)

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging Configuration
logging:
  level:
    com.willbank.authservice: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG

# Server Configuration
server:
  port: 8083
