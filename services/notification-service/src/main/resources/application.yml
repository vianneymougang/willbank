spring:
  application:
    name: notification-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/notifications_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:student@example.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8082
  servlet:
    context-path: /api/notifications

# Configuration API Gateway
api-gateway:
  url: http://localhost:8080
  service-id: notification-service

# Configuration Firebase
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
  database-url: ${FIREBASE_DATABASE_URL:https://your-project.firebaseio.com}

# Configuration RabbitMQ Queues
rabbitmq:
  queue:
    transactions: transaction.events
    notifications: notification.events
  exchange:
    transactions: transaction.exchange
  routing-key:
    transactions: transaction.#

logging:
  level:
    com.example.notificationservice: DEBUG
    org.springframework.amqp: DEBUG
