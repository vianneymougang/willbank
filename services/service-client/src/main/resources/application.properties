spring.application.name=service-client

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/willbank
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration du serveur
server.port=8081



eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# FORCER Eureka à utiliser localhost
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# URLs exactes pour Eureka
eureka.instance.home-page-url=http://localhost:${server.port}/
eureka.instance.status-page-url=http://localhost:${server.port}/
eureka.instance.health-check-url=http://localhost:${server.port}/

# Message gentil dans les logs
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO

# vérification de l'etat de santé
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info
management.server.port=${server.port}
management.server.address=localhost

# Désactiver la sécurité pour les tests
eureka.server.enable-self-preservation=false
eureka.server.renewal-percent-threshold=0.49

# Mode développement - Eureka est moins strict
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10