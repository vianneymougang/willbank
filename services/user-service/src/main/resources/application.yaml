spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://localhost:8888
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Application Security Configuration
app:
  security:
    encryption-key: ${TEMP_PASSWORD_ENCRYPTION_KEY:CHANGE_ME_IN_PRODUCTION_32CHARS_MINIMUM}
